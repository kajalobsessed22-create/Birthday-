
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎂</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-family: 'Trebuchet MS', sans-serif;
  background: linear-gradient(135deg, #ffd6e7, #e6d6ff);
  padding: 20px;
}

.card {
  background: white;
  padding: 35px 22px;
  border-radius: 25px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 10px 35px #b47da855;
}

h1 {
  color: #e75480;
  font-size: 34px;
  margin-bottom: 15px;
}

.emoji {
  font-size: 55px;
  margin: 15px;
}

p {
  color: #6d5265;
  font-size: 17px;
  line-height: 1.7;
  margin: 15px 0;
}

button {
  border: none;
  padding: 13px 28px;
  margin: 10px 5px;
  border-radius: 30px;
  font-size: 17px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.08);
}

.yes {
  background: #ff6b9a;
  color: white;
}

.no {
  background: #eee0f5;
  color: #7d5688;
}

#surprise {
  display: none;
  margin-top: 20px;
}

#answer {
  color: #e75480;
  font-weight: bold;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="card">
  <h1>HAPPY BIRTHDAY</h1>

  <div class="emoji">🎂🎀🎉</div>

  <h2 style="color:#a45b91; letter-spacing:4px;">
    ARJAN
  </h2>

  <p>
    A little surprise is waiting for you! 💗
    <br>
    Are you ready to open it?
  </p>

  <button class="yes" onclick="openSurprise()">
    YES 💖
  </button>

  <button class="no" onclick="noThanks()">
    NO 🙈
  </button>

  <div id="surprise">
    <div class="emoji">🥳💝✨</div>

    <h2 style="color:#e75480;">
      A Special Wish For You!
    </h2>

    <p>
      May your day be filled with happiness,
      laughter and beautiful memories.
      Keep smiling, keep shining and may
      all your dreams come true! 🌸
      <br><br>
      Have the most amazing birthday! 🎂
    </p>

    <div id="answer"></div>
  </div>
</div>


<script>
function openSurprise() {
  document.getElementById("surprise").style.display = "block";
  document.getElementById("answer").innerHTML =
    "Yayyy! Hope you loved this surprise! 💗";
}

function noThanks() {
  document.getElementById("surprise").style.display = "block";
  document.getElementById("answer").innerHTML =
    "Awww 🙈 No pressure! But your birthday wish is waiting here anyway. 💗";
}
</script>

</body>
</html>
